<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>EACVI TTE 60-Day Study Plan</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#17212b;background:#f5f7fa}
*{box-sizing:border-box} body{margin:0}.wrap{max-width:900px;margin:auto;padding:20px}.hero,.card{background:white;border:1px solid #dce2e8;border-radius:16px;padding:18px;margin-bottom:14px}
h1{margin:0 0 6px;font-size:26px}.muted{color:#647383}.progress{height:12px;background:#e7ebef;border-radius:99px;overflow:hidden;margin-top:12px}.bar{height:100%;background:#2463eb;width:0}
.stats{display:flex;justify-content:space-between;gap:12px;align-items:end}.pct{font-size:26px;font-weight:700}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}.filters button,.reset{border:1px solid #cfd7df;background:white;border-radius:10px;padding:10px 13px;font-size:15px}.filters button.active{background:#17212b;color:white}
.day{display:grid;grid-template-columns:32px 1fr auto;gap:10px;align-items:start;background:white;border:1px solid #dce2e8;border-radius:13px;padding:13px;margin-bottom:8px}.day.done{opacity:.58}.day input{width:22px;height:22px}.tag{font-size:12px;border:1px solid #dce2e8;border-radius:99px;padding:3px 7px;white-space:nowrap}.title{font-weight:700}.focus{font-size:14px;margin-top:4px;color:#44515e}.today{border-left:5px solid #2463eb}.small{font-size:13px}.foot{font-size:13px;color:#647383;margin:18px 2px}.actions{display:flex;justify-content:flex-end}
@media(max-width:520px){.wrap{padding:12px}.day{grid-template-columns:30px 1fr}.day .tag{grid-column:2;justify-self:start}.stats{align-items:start}h1{font-size:22px}}
</style></head><body><main class="wrap">
<section class="hero"><div class="stats"><div><div class="muted small">EACVI TTE • Exam 24 Nov 2026</div><h1>60-Day High-Yield Study Plan</h1><div class="muted">1 h/day • 2 h every 7th study day • progress saved on this device</div></div><div><div id="pct" class="pct">0%</div><div id="count" class="muted small">0 / 60</div></div></div><div class="progress"><div id="bar" class="bar"></div></div></section>
<section id="next" class="card today"></section>
<div class="filters"><button data-f="All" class="active">All</button><button data-f="Core">Core</button><button data-f="Consolidate">Consolidate</button><button data-f="Exam mode">Exam mode</button></div>
<section id="list"></section>
<div class="actions"><button class="reset" id="reset">Reset progress</button></div>
<div class="foot">Each copy saves progress independently in the browser using local storage. Sending this same HTML file to another person gives them a fresh, separate tracker.</div>
</main>

const KEY="eacvi_tte_60_progress_v1";
let done=new Set(JSON.parse(localStorage.getItem(KEY)||"[]")), filter="All";
const list=document.getElementById("list"), next=document.getElementById("next");
function save(){localStorage.setItem(KEY,JSON.stringify([...done].sort((a,b)=>a-b)))}
function update(){
 const n=done.size,p=Math.round(n/60*100); document.getElementById("pct").textContent=p+"%";document.getElementById("count").textContent=n+" / 60";document.getElementById("bar").style.width=p+"%";
 const d=DAYS.find(x=>!done.has(x.day))||DAYS[DAYS.length-1];
 next.innerHTML=`<div class="muted small">NEXT SESSION • DAY ${d.day} • ${d.phase.toUpperCase()}</div><div class="title" style="font-size:20px;margin-top:4px">${d.title}</div><div class="focus"><b>${d.source}</b> — ${d.focus}</div><div class="focus">${d.mins} min • ${d.mins===120?"≈75 min learning + 45 min questions":"≈40–45 min learning + 15–20 min active recall/questions"}</div>`;
}
function render(){
 list.innerHTML="";
 DAYS.filter(d=>filter==="All"||d.phase===filter).forEach(d=>{
  const el=document.createElement("div"); el.className="day"+(done.has(d.day)?" done":"");
  el.innerHTML=`<input type="checkbox" aria-label="Complete day ${d.day}" ${done.has(d.day)?"checked":""}><div><div class="muted small">DAY ${d.day} • ${d.phase.toUpperCase()}</div><div class="title">${d.title}</div><div class="focus"><b>${d.source}</b> — ${d.focus}</div></div><span class="tag">${d.mins} min</span>`;
  el.querySelector("input").addEventListener("change",e=>{e.target.checked?done.add(d.day):done.delete(d.day);save();render()});
  list.appendChild(el);
 }); update();
}
document.querySelectorAll("[data-f]").forEach(b=>b.addEventListener("click",()=>{filter=b.dataset.f;document.querySelectorAll("[data-f]").forEach(x=>x.classList.toggle("active",x===b));render()}));
document.getElementById("reset").addEventListener("click",()=>{if(confirm("Reset all saved progress on this device?")){done.clear();save();render()}});
render();
</script></body></html>
